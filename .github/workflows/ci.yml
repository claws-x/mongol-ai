name: Phase 0 quality baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install deterministic shaping runtime
        run: npm ci
      - name: Compile Python modules
        run: python -m compileall -q core nlp modules scripts tests
      - name: Verify publishable browser runtime
        run: npm run check:pages-runtime
      - name: Run regression tests
        run: python -m unittest discover -v
      - name: Run deterministic engine tests
        run: node --test tests/js/*.test.mjs
