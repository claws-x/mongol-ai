<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="传统蒙古文输入、竖排预览与基础响应 Alpha。">
    <title>传统蒙古文写作实验台 · Alpha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mongolian&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --ink: #172033;
            --muted: #5e687a;
            --brand: #3157c8;
            --brand-dark: #2445a5;
            --line: #dfe4ec;
            --surface: #ffffff;
            --soft: #f5f7fb;
            --notice: #fff8dd;
            --notice-line: #e5ce68;
            --radius: 16px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: var(--soft);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
        }

        button, textarea { font: inherit; }
        button { cursor: pointer; }

        .shell {
            width: min(1080px, calc(100% - 32px));
            margin: 0 auto;
            padding: 24px 0 48px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .back-link { color: var(--brand-dark); font-weight: 700; }
        .phase { color: var(--muted); font-size: 14px; }

        .heading {
            padding: 28px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }

        h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); }
        .heading p { margin: 0; color: var(--muted); }

        .notice {
            margin-top: 16px;
            padding: 14px 16px;
            background: var(--notice);
            border: 1px solid var(--notice-line);
            border-radius: 12px;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(360px, 0.78fr);
            gap: 18px;
            margin-top: 18px;
        }

        .panel {
            min-width: 0;
            padding: 22px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }

        .panel h2 { margin: 0 0 14px; font-size: 19px; }

        .conversation {
            display: flex;
            min-height: 390px;
            max-height: 560px;
            gap: 14px;
            overflow-x: auto;
            padding: 16px;
            background: var(--soft);
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        .empty-state {
            align-self: center;
            margin: auto;
            color: var(--muted);
            text-align: center;
        }

        .message {
            display: flex;
            flex: 0 0 auto;
            flex-direction: column;
            gap: 8px;
            min-width: 96px;
            max-width: 180px;
            padding: 12px;
            background: white;
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        .message[data-speaker="user"] { border-color: #9eb2ee; }
        .message-label { color: var(--muted); font-size: 12px; font-weight: 700; }

        .mongolian-text {
            min-height: 190px;
            max-height: 440px;
            overflow: auto;
            color: var(--ink);
            font-family: "Noto Sans Mongolian", "Mongolian Baiti", sans-serif;
            font-size: 22px;
            line-height: 1.65;
            writing-mode: vertical-lr;
            text-orientation: upright;
        }

        .field-label { display: block; margin-bottom: 8px; font-weight: 700; }

        .mongolian-textarea {
            width: 100%;
            height: 180px;
            padding: 14px;
            resize: vertical;
            color: var(--ink);
            background: white;
            border: 2px solid var(--line);
            border-radius: 12px;
            font-family: "Noto Sans Mongolian", "Mongolian Baiti", sans-serif;
            font-size: 22px;
            line-height: 1.6;
            writing-mode: vertical-lr;
            text-orientation: upright;
        }

        .mongolian-textarea:focus { border-color: var(--brand); outline: 3px solid #d8e0ff; }

        .input-tools {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr;
            gap: 8px;
            margin-top: 12px;
        }

        .tool-btn {
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: white;
        }

        .tool-btn.primary { color: white; background: var(--brand); border-color: var(--brand); font-weight: 700; }
        .tool-btn:hover { background: var(--soft); }
        .tool-btn.primary:hover { background: var(--brand-dark); }

        .keyboard { margin-top: 20px; }
        .keyboard-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

        .keyboard-tab {
            min-height: 40px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: white;
        }

        .keyboard-tab[aria-selected="true"] { color: white; background: var(--brand); border-color: var(--brand); }
        .keyboard-row { display: flex; flex-wrap: wrap; gap: 7px; }

        .key {
            display: flex;
            width: 48px;
            min-height: 52px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: white;
        }

        .key:hover { background: var(--soft); }
        .key-char {
            font-family: "Noto Sans Mongolian", "Mongolian Baiti", sans-serif;
            font-size: 20px;
            writing-mode: vertical-lr;
            text-orientation: upright;
        }
        .key-label { color: var(--muted); font-size: 10px; }

        button:focus-visible, a:focus-visible { outline: 3px solid #8da7ff; outline-offset: 2px; }

        @media (max-width: 820px) {
            .workspace { grid-template-columns: 1fr; }
            .conversation { min-height: 300px; }
        }

        @media (max-width: 480px) {
            .shell { width: min(100% - 20px, 1080px); padding-top: 12px; }
            .heading, .panel { padding: 16px; }
            .input-tools { grid-template-columns: 1fr 1fr; }
            .tool-btn.primary { grid-column: 1 / -1; }
            .key { width: 44px; min-height: 48px; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <div class="topbar">
            <a class="back-link" href="../../index.html">返回项目首页</a>
            <span class="phase">Phase 0 · Alpha</span>
        </div>

        <header class="heading">
            <h1>传统蒙古文写作与响应实验</h1>
            <p>输入蒙古文，验证原生竖排布局和基础交互。</p>
            <div class="notice" role="note">
                当前回复由本地关键词规则生成，不是大模型；文字与释义尚未完成母语专家审核，请勿用于正式出版或高风险场景。
            </div>
        </header>

        <div class="workspace">
            <section class="panel" aria-labelledby="conversation-title">
                <h2 id="conversation-title">实验记录</h2>
                <div class="conversation" id="conversation" aria-live="polite" aria-relevant="additions">
                    <p class="empty-state" id="empty-state">输入一段蒙古文后发送，记录会按从左到右的竖排列展示。</p>
                </div>
            </section>

            <section class="panel" aria-labelledby="composer-title">
                <h2 id="composer-title">输入区</h2>
                <label class="field-label" for="input">传统蒙古文</label>
                <textarea class="mongolian-textarea" id="input" lang="mn" placeholder="ᠮᠣᠩᠭᠣᠯ ᠪᠢᠴᠢᠭ..." aria-describedby="input-help"></textarea>
                <p id="input-help" class="phase">Enter 发送，Shift + Enter 换行。</p>

                <div class="input-tools">
                    <button class="tool-btn" id="clear-button" type="button">清空</button>
                    <button class="tool-btn" id="delete-button" type="button">退格</button>
                    <button class="tool-btn primary" id="send-button" type="button">发送到实验记录</button>
                </div>

                <div class="keyboard" aria-labelledby="keyboard-title">
                    <h2 id="keyboard-title">虚拟键盘</h2>
                    <div class="keyboard-tabs" role="tablist" aria-label="蒙古文字母分组">
                        <button class="keyboard-tab" type="button" role="tab" id="tab-vowels" aria-controls="panel-vowels" aria-selected="true" data-group="vowels">元音</button>
                        <button class="keyboard-tab" type="button" role="tab" id="tab-consonants-1" aria-controls="panel-consonants-1" aria-selected="false" data-group="consonants-1">辅音 1</button>
                        <button class="keyboard-tab" type="button" role="tab" id="tab-consonants-2" aria-controls="panel-consonants-2" aria-selected="false" data-group="consonants-2">辅音 2</button>
                        <button class="keyboard-tab" type="button" role="tab" id="tab-more" aria-controls="panel-more" aria-selected="false" data-group="more">更多</button>
                    </div>

                    <div id="panel-vowels" role="tabpanel" aria-labelledby="tab-vowels" data-key-panel="vowels">
                        <div class="keyboard-row">
                            <button class="key" type="button" data-char="ᠠ" aria-label="输入蒙古文字母 A"><span class="key-char" lang="mn">ᠠ</span><span class="key-label">A</span></button>
                            <button class="key" type="button" data-char="ᠡ" aria-label="输入蒙古文字母 E"><span class="key-char" lang="mn">ᠡ</span><span class="key-label">E</span></button>
                            <button class="key" type="button" data-char="ᠢ" aria-label="输入蒙古文字母 I"><span class="key-char" lang="mn">ᠢ</span><span class="key-label">I</span></button>
                            <button class="key" type="button" data-char="ᠣ" aria-label="输入蒙古文字母 O"><span class="key-char" lang="mn">ᠣ</span><span class="key-label">O</span></button>
                            <button class="key" type="button" data-char="ᠤ" aria-label="输入蒙古文字母 U"><span class="key-char" lang="mn">ᠤ</span><span class="key-label">U</span></button>
                            <button class="key" type="button" data-char="ᠥ" aria-label="输入蒙古文字母 Ö"><span class="key-char" lang="mn">ᠥ</span><span class="key-label">Ö</span></button>
                            <button class="key" type="button" data-char="ᠦ" aria-label="输入蒙古文字母 Ü"><span class="key-char" lang="mn">ᠦ</span><span class="key-label">Ü</span></button>
                        </div>
                    </div>

                    <div id="panel-consonants-1" role="tabpanel" aria-labelledby="tab-consonants-1" data-key-panel="consonants-1" hidden>
                        <div class="keyboard-row">
                            <button class="key" type="button" data-char="ᠨ" aria-label="输入蒙古文字母 N"><span class="key-char" lang="mn">ᠨ</span><span class="key-label">N</span></button>
                            <button class="key" type="button" data-char="ᠪ" aria-label="输入蒙古文字母 B"><span class="key-char" lang="mn">ᠪ</span><span class="key-label">B</span></button>
                            <button class="key" type="button" data-char="ᠫ" aria-label="输入蒙古文字母 P"><span class="key-char" lang="mn">ᠫ</span><span class="key-label">P</span></button>
                            <button class="key" type="button" data-char="ᠬ" aria-label="输入蒙古文字母 Q"><span class="key-char" lang="mn">ᠬ</span><span class="key-label">Q</span></button>
                            <button class="key" type="button" data-char="ᠭ" aria-label="输入蒙古文字母 G"><span class="key-char" lang="mn">ᠭ</span><span class="key-label">G</span></button>
                            <button class="key" type="button" data-char="ᠮ" aria-label="输入蒙古文字母 M"><span class="key-char" lang="mn">ᠮ</span><span class="key-label">M</span></button>
                            <button class="key" type="button" data-char="ᠯ" aria-label="输入蒙古文字母 L"><span class="key-char" lang="mn">ᠯ</span><span class="key-label">L</span></button>
                        </div>
                    </div>

                    <div id="panel-consonants-2" role="tabpanel" aria-labelledby="tab-consonants-2" data-key-panel="consonants-2" hidden>
                        <div class="keyboard-row">
                            <button class="key" type="button" data-char="ᠰ" aria-label="输入蒙古文字母 S"><span class="key-char" lang="mn">ᠰ</span><span class="key-label">S</span></button>
                            <button class="key" type="button" data-char="ᠱ" aria-label="输入蒙古文字母 Š"><span class="key-char" lang="mn">ᠱ</span><span class="key-label">Š</span></button>
                            <button class="key" type="button" data-char="ᠲ" aria-label="输入蒙古文字母 T"><span class="key-char" lang="mn">ᠲ</span><span class="key-label">T</span></button>
                            <button class="key" type="button" data-char="ᠳ" aria-label="输入蒙古文字母 D"><span class="key-char" lang="mn">ᠳ</span><span class="key-label">D</span></button>
                            <button class="key" type="button" data-char="ᠴ" aria-label="输入蒙古文字母 Č"><span class="key-char" lang="mn">ᠴ</span><span class="key-label">Č</span></button>
                            <button class="key" type="button" data-char="ᠵ" aria-label="输入蒙古文字母 J"><span class="key-char" lang="mn">ᠵ</span><span class="key-label">J</span></button>
                            <button class="key" type="button" data-char="ᠶ" aria-label="输入蒙古文字母 Y"><span class="key-char" lang="mn">ᠶ</span><span class="key-label">Y</span></button>
                        </div>
                    </div>

                    <div id="panel-more" role="tabpanel" aria-labelledby="tab-more" data-key-panel="more" hidden>
                        <div class="keyboard-row">
                            <button class="key" type="button" data-char="ᠷ" aria-label="输入蒙古文字母 R"><span class="key-char" lang="mn">ᠷ</span><span class="key-label">R</span></button>
                            <button class="key" type="button" data-char="ᠸ" aria-label="输入蒙古文字母 W"><span class="key-char" lang="mn">ᠸ</span><span class="key-label">W</span></button>
                            <button class="key" type="button" data-char="ᠹ" aria-label="输入蒙古文字母 F"><span class="key-char" lang="mn">ᠹ</span><span class="key-label">F</span></button>
                            <button class="key" type="button" data-char=" " aria-label="输入空格"><span aria-hidden="true">空格</span></button>
                            <button class="key" type="button" data-char="᠂" aria-label="输入蒙古文逗号"><span class="key-char" lang="mn">᠂</span><span class="key-label">逗号</span></button>
                            <button class="key" type="button" data-char="᠃" aria-label="输入蒙古文句号"><span class="key-char" lang="mn">᠃</span><span class="key-label">句号</span></button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const input = document.getElementById('input');
        const conversation = document.getElementById('conversation');
        const emptyState = document.getElementById('empty-state');
        const responses = new Map([
            ['ᠰᠠᠶᠢᠨ', ['ᠰᠠᠶᠢᠨ ᠪᠠᠶᠢᠨ᠎ᠠ᠃', 'ᠮᠡᠨᠳᠡ᠃']],
            ['ᠪᠠᠶᠠᠷᠲᠠᠢ', ['ᠪᠠᠶᠠᠷᠲᠠᠢ᠃']]
        ]);
        const fallbackResponse = 'ᠡᠨᠡ ᠪᠣᠯ ᠳᠦᠷᠢᠮ ᠳᠦ ᠰᠠᠭᠤᠷᠢᠯᠠᠭᠰᠠᠨ ᠲᠤᠷᠰᠢᠯᠲᠠ ᠪᠣᠯᠣᠨ᠎ᠠ᠃';

        function insertAtCursor(value) {
            const start = input.selectionStart;
            const end = input.selectionEnd;
            input.setRangeText(value, start, end, 'end');
            input.focus();
        }

        function deletePreviousCharacter() {
            const start = input.selectionStart;
            const end = input.selectionEnd;
            if (start !== end) {
                input.setRangeText('', start, end, 'end');
            } else if (start > 0) {
                input.setRangeText('', start - 1, start, 'end');
            }
            input.focus();
        }

        function createMessage(speaker, text) {
            const message = document.createElement('article');
            message.className = 'message';
            message.dataset.speaker = speaker;

            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = speaker === 'user' ? '你的输入' : '规则响应';

            const content = document.createElement('div');
            content.className = 'mongolian-text';
            content.lang = 'mn';
            content.textContent = text;

            message.append(label, content);
            return message;
        }

        function getResponse(text) {
            for (const [keyword, choices] of responses.entries()) {
                if (text.includes(keyword)) {
                    return choices[Math.floor(Math.random() * choices.length)];
                }
            }
            return fallbackResponse;
        }

        function send() {
            const text = input.value.trim();
            if (!text) {
                input.focus();
                return;
            }

            emptyState?.remove();
            conversation.append(createMessage('user', text));
            conversation.append(createMessage('assistant', getResponse(text)));
            input.value = '';
            input.focus();
            conversation.scrollLeft = conversation.scrollWidth;
        }

        document.querySelectorAll('[data-char]').forEach((button) => {
            button.addEventListener('click', () => insertAtCursor(button.dataset.char));
        });

        document.querySelectorAll('[data-group]').forEach((tab) => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('[data-group]').forEach((item) => {
                    item.setAttribute('aria-selected', String(item === tab));
                });
                document.querySelectorAll('[data-key-panel]').forEach((panel) => {
                    panel.hidden = panel.dataset.keyPanel !== tab.dataset.group;
                });
            });
        });

        document.getElementById('clear-button').addEventListener('click', () => {
            input.value = '';
            input.focus();
        });
        document.getElementById('delete-button').addEventListener('click', deletePreviousCharacter);
        document.getElementById('send-button').addEventListener('click', send);
        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                send();
            }
        });
    </script>
</body>
</html>
